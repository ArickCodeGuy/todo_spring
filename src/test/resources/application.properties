# Test configuration: replaces src/main/resources/application.properties during tests,
# so tests run against an in-memory H2 database and don't need PostgreSQL.
spring.application.name=todo_spring

spring.datasource.url=jdbc:h2:mem:todo_spring_test;DB_CLOSE_DELAY=-1
# spring.datasource.username=
# spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test_secret_key_used_only_in_tests
# ms
jwt.life-span=3600000
